[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assumptions-checkers"
version = "0.1.0"
description = "Check machine-learning model assumptions and data integrity before modelling."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Joe Bater" }]
requires-python = ">=3.9"
# Tested on pandas 2.2 and 3.1, statsmodels 0.14 and 0.15, numpy 1.26 and 2.x
dependencies = [
    "matplotlib",
    "numpy>=1.26",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5",
    "scipy",
    "seaborn",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["jupyter", "nbstripout", "openpyxl", "pytest"]

[project.urls]
Repository = "https://github.com/JoeBater/AssumptionsCheckers"

[tool.setuptools]
packages = ["assumptions", "overlays"]

[tool.pytest.ini_options]
testpaths = ["tests"]
